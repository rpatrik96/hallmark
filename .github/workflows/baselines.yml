name: Run Free Baselines

on:
  workflow_dispatch:
    inputs:
      split:
        description: 'Benchmark split to evaluate'
        required: false
        default: 'dev_public'
        type: choice
        options:
          - dev_public
          - test_public
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC

jobs:
  baseline:
    name: Evaluate ${{ matrix.baseline }}
    runs-on: ubuntu-latest
    # 15 was not enough: the doi_only live run resolves all 1,119 dev_public
    # DOIs serially against doi.org and was cancelled at 15m17s on run
    # 33915448052, mid-evaluation. It reported as `cancelled` rather than
    # `failure`, which is the reading a matrix `timeout-minutes` gives a job
    # that ran out of budget rather than one that broke.
    timeout-minutes: 30
    # Kept so one throttled baseline does not abort the others -- these hit
    # Semantic Scholar and CrossRef from a shared runner IP and a 429 is
    # routine. The cost is that the workflow's own conclusion stops meaning
    # anything: on 2026-08-31 run 33390676403 reported SUCCESS with all four
    # jobs failed, and nobody looked for months. The `gate` job at the bottom
    # restores the signal without giving up the isolation.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: doi_only
            max_entries: 0       # evaluate all; ~20 min against doi.org
            precomputed: false
          - baseline: bibtexupdater
            precomputed: true    # rate-limited — use pre-computed results
          # harc is out of the matrix until it has a current pre-computed result.
          # harc_dev_public.json was withdrawn on 2026-09-04 (a truncated run),
          # and harc_with_s2key_dev_public.json is registered known-stale in
          # scripts/check_results_freshness.py. Until then the leg copied a file
          # that did not exist and reported success -- run 33948051695 -- which
          # the #50 gate cannot see, because the job's conclusion was honest
          # about a step that had been told to swallow its own failure.
          - baseline: verify_citations
            max_entries: 50      # API-dependent — stratified sample
            precomputed: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Live evaluation path ---
      - name: Install dependencies (live)
        if: matrix.precomputed == false
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[baselines]"
          pipx install bibtex-updater
          pipx install harcx
          pipx install git+https://github.com/vishakhpk/verify_citations.git

      - name: Run baseline evaluation (live)
        if: matrix.precomputed == false
        run: |
          python -m hallmark.cli evaluate \
            --split ${{ inputs.split || 'dev_public' }} \
            --baseline ${{ matrix.baseline }} \
            --max-entries ${{ matrix.max_entries }} \
            --output results/${{ matrix.baseline }}_${{ inputs.split || 'dev_public' }}.json

      # --- Pre-computed validation path ---
      - name: Install dependencies (precomputed)
        if: matrix.precomputed == true
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate and copy pre-computed results
        if: matrix.precomputed == true
        run: |
          python -m hallmark.cli validate-results \
            --results-dir data/v1.2/baseline_results \
            --metadata data/v1.2/metadata.json \
            --strict
          mkdir -p results
          # A precomputed leg with nothing to copy has evaluated nothing; it must
          # not report success. The previous `|| echo` made exactly that green.
          src="data/v1.2/baseline_results/${{ matrix.baseline }}_${{ inputs.split || 'dev_public' }}.json"
          if [ ! -f "$src" ]; then
            echo "::error::no pre-computed result at $src -- this leg has nothing to evaluate"
            exit 1
          fi
          cp "$src" results/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.baseline }}
          path: results/${{ matrix.baseline }}_${{ inputs.split || 'dev_public' }}.json
          if-no-files-found: warn

  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: baseline
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[baselines]"

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true

      - name: Generate leaderboard
        run: |
          python -m hallmark.cli leaderboard \
            --split ${{ inputs.split || 'dev_public' }} \
            --results-dir results/

      - name: Append to history log
        run: |
          python -m hallmark.cli history-append \
            --results-dir results/ \
            --output results/history.jsonl

      - name: Commit history update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/history.jsonl
          git diff --cached --quiet || git commit -m "chore: update baseline history log [skip ci]"
          git push

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: combined-results
          path: results/
          if-no-files-found: warn

  gate:
    name: Fail if any baseline failed
    runs-on: ubuntu-latest
    needs: [baseline, aggregate]
    if: always()
    steps:
      # `continue-on-error` on the matrix means `needs.baseline.result` is
      # 'success' even when every job inside it failed; the honest signal is
      # `outcome`, which the matrix does not expose to a dependent job. So read
      # the run's own jobs through the API and fail on any conclusion that is
      # not success or skipped. This is the check that would have caught the
      # four TypeError failures on 2026-08-31 the same morning.
      - name: Check every job in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name != "Fail if any baseline failed") |
                  [.name, .conclusion] | @tsv' > jobs.tsv
          cat jobs.tsv
          if ! [ -s jobs.tsv ]; then
            echo "::error::no jobs reported for this run -- refusing to pass blind"
            exit 1
          fi
          failed=$(awk -F'\t' '$2 != "success" && $2 != "skipped"' jobs.tsv || true)
          if [ -n "$failed" ]; then
            echo "::error::baseline jobs failed:"
            echo "$failed"
            exit 1
          fi
          echo "all jobs succeeded"
