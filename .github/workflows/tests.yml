name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for hatch-vcs
          # The raw-versus-aggregate guard (tests/test_released_raw_matches_its_aggregate.py)
          # skips on an unfetched LFS pointer, and without this it skipped in every
          # CI run -- run 33948126186 shows `s.` on all four Python versions -- so the
          # guard that #54 added was inert exactly where it was meant to run.
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Check results freshness
        # Every aggregate result JSON must record the split revision it scored
        # (split_sha256) and agree with that split's current entry counts.
        #
        # This is a hard gate. It was `--warn-only` because the check compared
        # file mtimes, which git does not preserve, so on a fresh clone it read
        # checkout order and called all 46 results stale -- and a guard that is
        # always red gets silenced. It now hashes the split file, and results
        # predating that field are reported as unverifiable rather than stale.
        # Two genuinely stale results are registered in KNOWN_STALE in the
        # script, so CI fails on new staleness while the known debt stays
        # visible; that register may only shrink.
        #
        # --version was still v1.0 after the data moved to data/v1.2, so the
        # guard was resolving split files under a directory the rename removed.
        #
        # The same invocation now also checks the derived tables under tables/,
        # which had no guard at all: they are arithmetic over these result JSONs,
        # so a re-run leaves them describing numbers that no longer exist.
        # base_rate_precision.csv reported a doi_only false-positive rate of
        # 0.2788 against the 0.0417 its source run now records. Tables are checked
        # against recorded input hashes where a generator writes them and against
        # the runs their tool column names otherwise; KNOWN_STALE_TABLES carries
        # the known debt and may only shrink, like KNOWN_STALE above.
        run: python scripts/check_results_freshness.py --results-dir data/v1.2/baseline_results --data-dir data --version v1.2

      - name: Check results/ freshness
        # ``results/`` is the default --results-dir for the CLI leaderboard and
        # the figure scripts, so whatever sits at its top level is read as a
        # current result -- and until now nothing checked it. The same gate runs
        # over it, hard and with the same flags; the tables are checked once, in
        # the step above, against the canonical directory they derive from.
        #
        # Runs kept for the record live in results/archive/, which the gate and
        # the leaderboard both skip: a CI sample, a smoke run or a temporal probe
        # scores no current split, so a staleness verdict on it says nothing.
        # The subdirectories results/superseded_pre_relabel/,
        # results/failed_runs/ and results/checkpoints/ are outside the gate's
        # non-recursive glob and stay where they are.
        run: python scripts/check_results_freshness.py --results-dir results --skip-tables --data-dir data --version v1.2

      - name: Check the site payload against its inputs
        # site/data/site_data.js is generated from the released results, and a
        # result re-run leaves it describing numbers that no longer exist -- the
        # same failure the table guard catches one layer down. --check
        # regenerates into a temporary directory and compares, ignoring only the
        # generation date.
        run: python scripts/generate_site_data.py --check

      - name: Run tests
        run: pytest --tb=short -q --cov=hallmark --cov-report=term-missing

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pinned mypy hook
        run: |
          python -m pip install pre-commit
          pre-commit run mypy --all-files

  build:
    runs-on: ubuntu-latest
    needs: [test, type-check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
