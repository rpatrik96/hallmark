name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for hatch-vcs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy hallmark/ --ignore-missing-imports
        continue-on-error: true

      - name: Check results freshness
        # Every aggregate result JSON must record the split revision it scored
        # (split_sha256) and agree with that split's current entry counts.
        #
        # This is a hard gate. It was `--warn-only` because the check compared
        # file mtimes, which git does not preserve, so on a fresh clone it read
        # checkout order and called all 46 results stale -- and a guard that is
        # always red gets silenced. It now hashes the split file, and results
        # predating that field are reported as unverifiable rather than stale.
        # Two genuinely stale results are registered in KNOWN_STALE in the
        # script, so CI fails on new staleness while the known debt stays
        # visible; that register may only shrink.
        #
        # --version was still v1.0 after the data moved to data/v1.2, so the
        # guard was resolving split files under a directory the rename removed.
        #
        # The same invocation now also checks the derived tables under tables/,
        # which had no guard at all: they are arithmetic over these result JSONs,
        # so a re-run leaves them describing numbers that no longer exist.
        # base_rate_precision.csv reported a doi_only false-positive rate of
        # 0.2788 against the 0.0417 its source run now records. Tables are checked
        # against recorded input hashes where a generator writes them and against
        # the runs their tool column names otherwise; KNOWN_STALE_TABLES carries
        # the known debt and may only shrink, like KNOWN_STALE above.
        run: python scripts/check_results_freshness.py --results-dir data/v1.2/baseline_results --data-dir data --version v1.2

      - name: Run tests
        run: pytest --tb=short -q --cov=hallmark --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
